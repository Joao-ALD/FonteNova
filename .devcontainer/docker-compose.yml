version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codespace-app
    restart: unless-stopped
    working_dir: /var/www/html
    # Mapeamento do codigo do repositorio (..) para o container
    volumes:
      - ..:/var/www/html
      # Volumes nomeados para cache de dependencias (melhora a performance)
      - vendor_cache:/var/www/html/vendor
      - node_modules_cache:/var/www/html/node_modules
    networks:
      - app-network
    command: php-fpm -F # Comando de inicializacao rapido

  webserver:
    image: nginx:alpine
    container_name: codespace-nginx
    restart: unless-stopped
    ports:
      - "80:80" # Porta principal da aplicacao
    volumes:
      - ..:/var/www/html
      # Configuração Nginx que será definida no proximo passo
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: codespace-mysql
    restart: unless-stopped
    environment:
      # Valores padroes para Codespaces
      MYSQL_DATABASE: ${DB_DATABASE:-fontenova}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-user}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: codespace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    container_name: codespace-mailpit
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web UI Port
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  vendor_cache:
    driver: local
  node_modules_cache:
    driver: local